# Railway deploy config — Freewall backend
# In Railway UI, set "Root Directory" = "backend" so this file is picked up.
# Reference: https://docs.railway.app/reference/config-as-code

[build]
# Use Dockerfile for deterministic build (nixpacks' uv autodetect was broken).
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Healthcheck — FastAPI /health route returns {"status":"ok"}.
healthcheckPath = "/health"
healthcheckTimeout = 30
# Auto-restart on failure (decision #19 mandatory)
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
