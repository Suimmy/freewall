# Railway deploy config — Freewall backend
# Place this at repo root (or /backend) when connecting Railway.
# Reference: https://docs.railway.app/reference/config-as-code

[build]
# Railway auto-detects pyproject.toml, but we make it explicit:
builder = "NIXPACKS"
buildCommand = "uv sync --frozen --no-dev"

[deploy]
# Start command — uvicorn binds $PORT (Railway-injected) on 0.0.0.0
startCommand = "uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT"
# Health check path — the FastAPI /health route
healthcheckPath = "/health"
# Auto-restart on failure (decision #19 mandatory)
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
